<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #080653;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
        }

        .logo {
            text-align: center;
            padding: 40px 10px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.3;
        }

        .sidebar a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .sidebar a:hover {
            background: #303b87;
        }

        .active {
            background: #303b87;
        }

     
        .main {
            margin-left: 250px;
        }

        .topbar {
            height: 80px;
            background: #eae9fb;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 30px;
        }

        .logout {
            font-size: 22px;
            font-weight: bold;
            color: black;
            text-decoration: none;
        }

       
        .profile {
            padding: 15px 20px 45px;
        }

        h1 {
            font-size: 27px;
            margin: 0 0 20px;
        }

        .info {
            display: flex;
            font-size: 22px;
            margin: 15px 10px;
        }

        .label {
            width: 125px;
            font-weight: bold;
        }

        .value {
            flex: 1;
        }

      
        .contact {
            border-top: 1px solid #999;
            padding: 20px;
        }

        .contact h2 {
            font-size: 24px;
            margin: 0 0 25px;
        }

        .back {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 22px;
            border: 1px solid #aaa;
            border-radius: 10px;
            color: black;
            background: white;
            text-decoration: none;
            font-size: 18px;
        }

        .back:hover {
            background: #eee;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 170px;
            }

            .logo {
                font-size: 15px;
            }

            .sidebar a {
                font-size: 15px;
                padding: 12px 8px;
            }

            .main {
                margin-left: 170px;
            }

            .info {
                font-size: 16px;
            }

            .label {
                width: 100px;
            }

            .contact h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

   
    <div class="sidebar">

        <div class="logo">
            Student Information<br>
            Management System
        </div>

      
        <a href="Studentlist.html">
            ⌂ &nbsp; Student list
        </a>

      
        <a href="addstudent.html">
            ＋ &nbsp; Add student
        </a>

       
        <a href="studentprofile.html" class="active">
            ♟ &nbsp; Student profile
        </a>

    </div>

  
    <div class="main">

      
        <div class="topbar">

          
            <a href="Student Information system-2D.html" class="logout">Logout</a>

        </div>

       
        <div class="profile">

            <h1>STUDENT PROFILE</h1>

            <div class="info">
                <div class="label">Name:</div>
                <div class="value" id="name">Maria Clara</div>
            </div>

            <div class="info">
                <div class="label">Grade:</div>
                <div class="value" id="grade">9</div>
            </div>

            <div class="info">
                <div class="label">Section:</div>
                <div class="value" id="section">Taurine</div>
            </div>

            <div class="info">
                <div class="label">Student ID:</div>
                <div class="value" id="studentID">131</div>
            </div>

        </div>

       
        <div class="contact">

            <h2>Contact Information</h2>

            <div class="info">
                <div class="label">Email:</div>
                <div class="value" id="email">
                    mariaclarita@gmail.com
                </div>
            </div>

            <div class="info">
                <div class="label">Phone:</div>
                <div class="value" id="contact">
                    09332568741
                </div>
            </div>

           
            <a href="Studentlist.html" class="back">Back</a>

        </div>

    </div>

    <script>

   

        var student = {
            id: 131,
            name: "Maria Clara",
            grade: 9,
            section: "Taurine",
            email: "mariaclarita@gmail.com",
            contact: "09332568741"
        };

        

        var savedStudent = localStorage.getItem("selectedStudent");

        if (savedStudent != null) {

            student = JSON.parse(savedStudent);

        }


        document.getElementById("name").innerHTML =
            student.name || "Not available";

        document.getElementById("grade").innerHTML =
            student.grade || "Not available";

        document.getElementById("section").innerHTML =
            student.section || "Not available";

        document.getElementById("studentID").innerHTML =
            student.id || "Not available";

        document.getElementById("email").innerHTML =
            student.email || "Not available";

        document.getElementById("contact").innerHTML =
            student.contact || "Not available";

    </script>

</body>
</html>
