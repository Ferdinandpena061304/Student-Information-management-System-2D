<!DOCTYPE html>
<html>
<head>
    <title>SIMS - Student List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .sidebar {
            background: #080653;
            color: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar h2 {
            font-size: 20px;
            text-align: center;
            padding: 35px 10px;
            margin: 0;
            line-height: 1.3;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 20px;
        }

        .sidebar a:hover,
        .sidebar .active {
            background: #303b87;
        }

        .main {
            margin-left: 250px;
        }

        .topbar {
            height: 80px;
            background: #eae9fb;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 30px;
        }

        .logout {
            color: black;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .content {
            padding: 20px;
        }

        h1 {
            font-size: 27px;
            margin: 0 0 15px;
        }

        .search-area {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 13px;
            font-size: 17px;
            border: 1px solid #888;
            border-radius: 7px;
            background: white;
        }

        input {
            flex: 2;
            min-width: 0;
        }

        select {
            flex: 1;
            min-width: 130px;
        }

        .table-area {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 17px;
        }

        th {
            background: #efeeff;
            color: #333;
        }

        th, td {
            border: 1px solid #bbb;
            padding: 10px;
            text-align: center;
        }

        td:nth-child(2) {
            text-align: left;
        }

        button {
            border: none;
            padding: 8px 14px;
            margin: 2px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .view {
            background: #668aff;
            color: black;
        }

        .edit {
            background: #e8e8e8;
        }

        .delete {
            background: #f58b8b;
        }

        button:hover {
            opacity: 0.8;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 170px;
            }

            .sidebar h2 {
                font-size: 15px;
            }

            .sidebar a {
                font-size: 15px;
                padding: 12px 8px;
            }

            .main {
                margin-left: 170px;
            }

            .content {
                padding: 10px;
            }

            .search-area {
                flex-direction: column;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>


    <div class="sidebar">

        <h2>
            Student Information<br>
            Management System
        </h2>

        <a href="studentlist.html" class="active">
            ⌂ &nbsp; Student list
        </a>

        <a href="addstudent.html">
            ＋ &nbsp; Add student
        </a>

        <a href="Studentprofile.html">
            ♟ &nbsp; Student profile
        </a>

    </div>

    <div class="main">

        <div class="topbar">
            <a href="index.html"
               class="logout">Logout</a>
        </div>

        <div class="content">

            <h1>STUDENT LIST</h1>

            <div class="search-area">

                <input
                    type="text"
                    id="search"
                    placeholder="⌕ Search by name"
                >

                <select id="gradeFilter">
                    <option value="All">All Grades</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>

            </div>

         
            <div class="table-area">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Grade</th>
                            <th>Section</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable"></tbody>
                </table>

            </div>

        </div>
    </div>

    <script>

   

        var defaultStudents = [
            {
                id: 131,
                name: "Maria Clara",
                grade: 9,
                section: "Taurine",
                email: "mariaclarita@gmail.com",
                contact: "09332568741"
            },
            {
                id: 137,
                name: "Niru Poyatos",
                grade: 10,
                section: "Silang",
                email: "nirupoyatos@gmail.com",
                contact: "09123456782"
            }
        ];


        var savedStudents = localStorage.getItem("students");
        var students;

        if (savedStudents != null) {
            students = JSON.parse(savedStudents);
        } else {
            students = defaultStudents;
            saveStudents();
        }

        var table = document.getElementById("studentTable");
        var search = document.getElementById("search");
        var gradeFilter = document.getElementById("gradeFilter");


        function saveStudents() {
            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
        }


        function displayStudents(list) {

            table.innerHTML = "";

            if (list.length == 0) {
                table.innerHTML =
                    "<tr><td colspan='5'>No students found.</td></tr>";
                return;
            }

            list.forEach(function(student) {

                var row = document.createElement("tr");

                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.grade}</td>
                    <td>${student.section}</td>
                    <td>
                        <button class="view"
                            onclick="viewStudent(${student.id})">
                            View
                        </button>

                        <button class="edit"
                            onclick="editStudent(${student.id})">
                            Edit
                        </button>

                        <button class="delete"
                            onclick="deleteStudent(${student.id})">
                            Del
                        </button>
                    </td>
                `;

                table.appendChild(row);

            });
        }

      

        function searchStudents() {

            var name = search.value.toLowerCase();
            var grade = gradeFilter.value;

            var result = students.filter(function(student) {

                var matchName =
                    student.name.toLowerCase().includes(name);

                var matchGrade =
                    grade == "All" ||
                    student.grade.toString() == grade;

                return matchName && matchGrade;

            });

            displayStudents(result);
        }

        search.addEventListener("input", searchStudents);
        gradeFilter.addEventListener("change", searchStudents);

    

        function viewStudent(id) {

            var student = students.find(function(item) {
                return item.id == id;
            });

            if (student) {

                localStorage.setItem(
                    "selectedStudent",
                    JSON.stringify(student)
                );

                window.location.href = "Studentprofile.html";
            }
        }


   
      function editStudent(id) {
        window.location.href = "Editstudent.html?id=" + id;
}


        function deleteStudent(id) {

            var answer = confirm(
                "Do you want to delete this student?"
            );

            if (answer) {

                students = students.filter(function(student) {
                    return student.id != id;
                });

                saveStudents();
                searchStudents();
            }
        }

  

        displayStudents(students);

    </script>

</body>
</html>
