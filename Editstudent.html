```html
<!DOCTYPE html>
<html>
<head>
    <title>SIMS - Edit Student</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #080b2b;
        }

        .sidebar {
            width: 250px;
            background: #080653;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            padding-top: 40px;
        }

        .sidebar h3 {
            text-align: center;
            line-height: 1.4;
            margin-bottom: 45px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .sidebar a:hover,
        .sidebar .active {
            background: #303b87;
        }

        .main {
            margin-left: 250px;
        }

        .topbar {
            height: 80px;
            background: #eae9fb;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 30px;
        }

        .logout {
            color: black;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .content {
            padding: 15px 35px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            font-size: 17px;
            border: 1px solid #888;
            border-radius: 7px;
            background: white;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .field {
            flex: 1;
            min-width: 0;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin: 30px 20px;
        }

        button {
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .cancel {
            background: white;
            border: 1px solid #aaa;
        }

        .update {
            background: #0645ff;
            color: white;
            border: none;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 170px;
            }

            .sidebar h3 {
                font-size: 15px;
            }

            .sidebar a {
                font-size: 15px;
                padding: 12px 8px;
            }

            .main {
                margin-left: 170px;
            }

            .content {
                padding: 15px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h3>
            Student Information<br>
            Management System
        </h3>

        <a href="studentlist.html" class="active">
            ⌂ Student list
        </a>

        <a href="addstudent.html">
            ＋ Add student
        </a>

        <a href="Studentprofile.html">
            ♟ Student profile
        </a>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <div class="topbar">
            <a href="Student Information system-2D.html"
               class="logout">Logout</a>
        </div>

        <div class="content">

            <h1>EDIT STUDENT</h1>

            <form id="editForm">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required>

                <div class="row">

                    <div class="field">
                        <label for="grade">Grade</label>
                        <select id="grade" required>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="section">Section</label>
                        <select id="section" required>
                            <option value="Taurine">Taurine</option>
                            <option value="Silang">Silang</option>
                            <option value="Gemini">Gemini</option>
                            <option value="Aries">Aries</option>
                            <option value="Leo">Leo</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <label for="contact">Contact no.</label>
                <input type="tel" id="contact" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <div class="buttons">

                    <button type="button" class="cancel"
                            onclick="cancelEdit()">
                        Cancel
                    </button>

                    <button type="submit" class="update">
                        Update
                    </button>

                </div>

            </form>

        </div>
    </div>

    <script>

      
        var params = new URLSearchParams(window.location.search);
        var studentId = params.get("id");

      
        var students = JSON.parse(
            localStorage.getItem("students")
        ) || [];

      
        var student = students.find(function(item) {
            return String(item.id) === String(studentId);
        });

        if (student) {

            document.getElementById("fullName").value =
                student.name || "";

            document.getElementById("grade").value =
                student.grade || "";

            document.getElementById("section").value =
                student.section || "";

            document.getElementById("contact").value =
                student.contact || "";

            document.getElementById("email").value =
                student.email || "";

        } else {

            alert("Student not found! Please select Edit from Student List.");

        }

        document.getElementById("editForm").onsubmit =
            function(event) {

                event.preventDefault();

                if (!student) {
                    alert("Student not found!");
                    return;
                }

                student.name =
                    document.getElementById("fullName").value.trim();

                student.grade = Number(
                    document.getElementById("grade").value
                );

                student.section =
                    document.getElementById("section").value;

                student.contact =
                    document.getElementById("contact").value.trim();

                student.email =
                    document.getElementById("email").value.trim();

                // Save and updatess
                localStorage.setItem(
                    "students",
                    JSON.stringify(students)
                );

                alert("Student information updated successfully!");

                
                window.location.href = "studentlist.html";
            };

        // to caancel
        function cancelEdit() {
            window.location.href = "studentlist.html";
        }

    </script>

</body>
</html>
```
